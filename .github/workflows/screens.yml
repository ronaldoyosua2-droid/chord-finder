name: Screenshots

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build APK]
    types: [completed]

permissions:
  contents: write

jobs:
  shots:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          gradle :app:testReleaseUnitTest :app:assembleRelease -q 2>&1 | tee build.log
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk out/app.apk

      - name: Diagnosa YouTube
        run: bash .github/scripts/ytprobe.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator + SS
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/screens.sh

      - name: Simpan SS ke branch screenshots
        if: always()
        run: |
          mkdir -p shots
          cp build.log shots/ 2>/dev/null || true
          grep -E "^e: |error:|FAILED|Exception" build.log > shots/errors.txt 2>/dev/null || true
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A && git commit -qm "Screenshots ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
