name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Unit test (parser chord & notasi angka)
        run: gradle :app:testReleaseUnitTest --stacktrace

      - name: Build APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/ChordFinder-v1.0.${{ github.run_number }}.apk

      - name: Release notes
        run: |
          V=1.0.${{ github.run_number }}
          {
            cat .github/release/INTRO.md
            echo
            echo "## ✨ What's new · v$V"
            echo
            cat WHATS_NEW.md
            echo
            echo "---"
            echo
            sed "s/VERSION/$V/" .github/release/OUTRO.md
          } > release_notes.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Chord Finder v1.0.${{ github.run_number }}
          body_path: release_notes.md
          files: out/*.apk
          make_latest: true
